name: CI - Frontend

on:
  pull_request:
    branches: [main]
    paths: [apps/client/angular/**]
  push:
    branches: [main]
    paths: [apps/client/angular/**]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client/angular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/client/angular/package-lock.json

      - run: npm ci

      - name: Create environment.ts for CI
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:ci

      - run: npm run build

      - run: npm audit --audit-level=high --omit=dev
