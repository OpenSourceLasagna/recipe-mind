[project]
name = "server"
version = "0.1.0"
description = "Recipe Mind backend API with Supabase and RAG-powered search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.137.0",
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "ruff>=0.15.13",
    "supabase>=2.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.6",
    "openai>=2.41.0",
    "recipe-scrapers>=15.11.0",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.49",
    "pgvector>=0.4.2",
    "asyncpg>=0.31.0",
    "sentence-transformers>=5.5.1",
    "pytest>=9.1.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "pip-audit>=2.10.1",
    "nltk>=3.9.4",
    "scikit-learn>=1.9.0",
    "transformers>=5.12.1",
    "optimum[onnxruntime]>=2.1.0,<2.2",
    "onnxruntime>=1.18.0",
    "einops>=0.8.2"
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
