<section class="space-y-4">
  <div>
    <h2 class="text-lg font-semibold">Ingredients</h2>
    <p class="text-sm text-muted-foreground">Add every ingredient with quantity and unit.</p>
  </div>

  <div
    class="hidden sm:grid sm:grid-cols-[80px_96px_1fr_40px] gap-2 px-1 text-xs font-medium text-muted-foreground uppercase tracking-wider"
  >
    <span>Qty</span>
    <span>Unit</span>
    <span>Ingredient</span>
    <span></span>
  </div>

  <ul class="space-y-2">
    @for (item of ingredients(); track trackByIndex($index); let index = $index) {
      <li
        class="group flex flex-col sm:flex-row items-start sm:items-center gap-2 rounded-lg border bg-background p-3 sm:p-2 transition-colors hover:bg-muted/30"
      >
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label class="sm:hidden text-xs font-medium text-muted-foreground w-14">Qty</label>
          <input
            hlmInput
            type="number"
            step="0.5"
            min="0"
            class="w-full sm:w-20"
            placeholder="1"
            [value]="item.quantity"
            (input)="onQuantityInput(index, $event)"
          />
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label class="sm:hidden text-xs font-medium text-muted-foreground w-14">Unit</label>
          <input
            hlmInput
            type="text"
            class="w-full sm:w-24"
            placeholder="cups"
            [value]="item.unit"
            (input)="onUnitInput(index, $event)"
          />
        </div>

        <div class="flex items-center gap-2 w-full sm:flex-1">
          <label class="sm:hidden text-xs font-medium text-muted-foreground w-14">Name</label>
          <input
            hlmInput
            type="text"
            class="flex-1"
            placeholder="All-purpose flour"
            [value]="item.ingredientName"
            (input)="onNameInput(index, $event)"
          />
        </div>

        <div class="w-full sm:w-10 flex justify-end">
          <button
            hlmBtn
            variant="ghost"
            size="icon"
            type="button"
            class="text-muted-foreground hover:text-destructive transition-colors"
            (click)="removeIngredient(index)"
            [attr.aria-label]="'Remove ' + (item.ingredientName || 'ingredient')"
          >
            <ng-icon hlm name="heroTrash" class="size-4" />
          </button>
        </div>
      </li>
    }
  </ul>

  <button
    hlmBtn
    variant="outline"
    size="sm"
    type="button"
    class="gap-1.5 w-full sm:w-auto"
    (click)="addIngredient()"
  >
    <ng-icon hlm name="heroPlus" class="size-4" />
    Add ingredient
  </button>

  @if (hasError()) {
    <p class="text-destructive text-sm font-medium">
      {{ errorMessage() }}
    </p>
  }
</section>
