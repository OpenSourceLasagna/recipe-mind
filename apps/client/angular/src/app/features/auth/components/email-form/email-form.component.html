<form (submit)="onSubmit($event)">
  <div hlmFieldGroup>
    <fieldset hlmFieldset>
      <hlm-field>
        <label hlmFieldLabel for="email">Email</label>
        <hlm-input-group>
          <input
            hlmInputGroupInput
            id="email"
            type="email"
            placeholder="you@example.com"
            [formField]="emailLoginForm.email"
            autocomplete="email"
          />
          <hlm-input-group-addon>
            <ng-icon name="email" />
          </hlm-input-group-addon>
        </hlm-input-group>
        @if (emailLoginForm.email().invalid() && emailLoginForm.email().touched()) {
          <ul
            [id]="emailErrorId"
            role="alert"
            class="mt-1.5 flex flex-col gap-1 text-sm text-destructive"
          >
            @for (error of emailLoginForm.email().errors(); track error.kind) {
              <li class="flex items-start gap-1.5">
                <ng-icon name="error" class="mt-0.5 shrink-0 text-base" />
                <span>{{ error.message }}</span>
              </li>
            }
          </ul>
        }
      </hlm-field>

      <app-password-input
        label="Password"
        [formField]="emailLoginForm.password"
        [forgotPasswordLabel]="showForgotPassword() ? 'Forgot?' : null"
        [showStrengthMeter]="mode() === 'registration'"
        [autocomplete]="mode() === 'registration' ? 'new-password' : 'current-password'"
        (forgotPassword)="forgotPassword.emit()"
      ></app-password-input>

      @if (!emailLoginForm.confirmPassword().hidden()) {
        <app-password-input
          placeholder="Confirm your password"
          label="Confirm Password"
          [formField]="emailLoginForm.confirmPassword"
          autocomplete="new-password"
        ></app-password-input>
      }

      @if (authError()) {
        <p
          role="alert"
          class="mt-2 flex items-start gap-1.5 rounded-md border border-destructive/30 bg-destructive/10 px-3 py-2 text-sm text-destructive"
        >
          <ng-icon name="error" class="mt-0.5 shrink-0 text-base" />
          <span>{{ authError() }}</span>
        </p>
      }
      <button
        type="submit"
        hlmBtn
        class="w-full mt-4 h-11 text-sm font-semibold"
        [disabled]="!emailLoginForm().valid()"
      >
        {{ mode() === 'login' ? 'Sign In' : 'Create Account' }}
      </button>
    </fieldset>
  </div>
</form>
