<hlm-field>
  <div class="flex items-center justify-between">
    <label hlmFieldLabel [for]="name()">{{ label() }}</label>
    @if (forgotPasswordLabel()) {
      <button
        type="button"
        hlmBtn
        variant="link"
        size="sm"
        class="h-auto px-0 text-xs font-medium"
        (click)="forgotPassword.emit()"
      >
        {{ forgotPasswordLabel() }}
      </button>
    }
  </div>
  <hlm-input-group>
    <hlm-input-group-addon>
      <ng-icon name="key" />
    </hlm-input-group-addon>
    <input
      hlmInputGroupInput
      [id]="name()"
      [type]="visible() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="handleInput($event.target.value)"
      [disabled]="disabled()"
      (blur)="touched.set(true)"
      [class.invalid]="invalid() && touched()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-required]="required()"
      [attr.name]="name()"
    />
    <button
      type="button"
      hlmInputGroupButton
      (click)="changeVisibility()"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    >
      <ng-icon [name]="visible() ? 'eyeSlash' : 'eye'" class="text-muted-foreground"></ng-icon>
    </button>
  </hlm-input-group>
  @if (showStrengthMeter() && value().length > 0) {
    <div class="mt-2" role="status" aria-live="polite">
      <div class="flex gap-1">
        @for (i of [0, 1, 2, 3]; track i) {
          <div
            class="h-1 flex-1 rounded-full transition-colors"
            [class.bg-muted]="i >= strength().score"
            [class.bg-destructive]="i < strength().score && strength().score <= 1"
            [class.bg-amber-500]="i < strength().score && strength().score === 2"
            [class.bg-blue-500]="i < strength().score && strength().score === 3"
            [class.bg-emerald-500]="i < strength().score && strength().score === 4"
          ></div>
        }
      </div>
      <p class="mt-1 text-xs text-muted-foreground">{{ strength().label }}</p>
    </div>
  }
  @if (invalid() && touched()) {
    <ul [id]="errorId()" role="alert" class="mt-1.5 flex flex-col gap-1 text-sm text-destructive">
      @for (error of errors(); track error.kind) {
        <li class="flex items-start gap-1.5">
          <ng-icon name="error" class="mt-0.5 shrink-0 text-base" />
          <span>{{ error.message }}</span>
        </li>
      }
    </ul>
  }
</hlm-field>
