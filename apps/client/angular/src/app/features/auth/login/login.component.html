<section class="w-full max-w-sm bg-white shadow-lg border border-gray-200 rounded-lg" hlmCard>
  <div hlmCardHeader>
    <div class="mb-4 flex items-center gap-2">
      <span class="grid size-7 place-items-center rounded-lg bg-primary/15 ring-1 ring-primary/30">
        <ng-icon name="heroSparkles" class="text-primary text-sm" />
      </span>
      <span class="text-lg font-bold tracking-tight text-foreground">CulinarAI</span>
    </div>
    <h3 hlmCardTitle>{{ typeText().title }}</h3>
    <p hlmCardDescription>{{ typeText().description }}</p>
  </div>
  <div hlmCardContent>
    <app-email-form
      [authError]="error()"
      [mode]="mode()"
      [showForgotPassword]="mode() === 'login'"
      (submitForm)="onSubmitEmailLogin($event)"
      (forgotPassword)="onForgotPassword()"
    ></app-email-form>
  </div>
  <p class="px-6 pb-6 pt-2 text-sm text-muted-foreground text-center">
    {{ mode() === 'login' ? "Don't have an account?" : 'Already have an account?' }}
    <button hlmBtn variant="link" size="sm" class="px-1 h-auto" (click)="changeType()">
      {{ mode() === 'login' ? 'Create one' : 'Sign in' }}
    </button>
  </p>
</section>
