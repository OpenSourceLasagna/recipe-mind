<hlm-sheet [side]="side()">
  <button hlmBtn variant="outline" size="sm" hlmSheetTrigger>
    <ng-content select="[sheetTriggerButtonContent]"></ng-content>
  </button>
  <hlm-sheet-content class="max-h-[85vh] !h-[85vh] overflow-hidden" *hlmSheetPortal="let ctx">
    <hlm-sheet-header>
      <h3 hlmSheetTitle>Filters</h3>
      <p hlmSheetDescription>Refine your recipe results</p>
    </hlm-sheet-header>

    <div class="flex-1 min-h-0 overflow-y-auto px-4 py-2 space-y-4">
      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Difficulty</h4>
        <app-filter-difficulty [formField]="filter.form.difficulty" />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Spice Level</h4>
        <app-filter-spice-rating [formField]="filter.form.spiceMax" />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Duration</h4>
        <app-filter-slider-range
          [formField]="filter.form.duration"
          [sliderMin]="durationRange[0]"
          [sliderMax]="durationRange[1]"
          [step]="5"
          unit="min"
          label="Duration"
        />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Servings</h4>
        <app-filter-slider-range
          [formField]="filter.form.servings"
          [sliderMin]="servingsRange[0]"
          [sliderMax]="servingsRange[1]"
          [step]="1"
          label="Servings"
        />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Cuisine Origin</h4>
        <app-filter-origin [formField]="filter.form.origin" />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Ingredient Categories</h4>
        <app-filter-categories [formField]="filter.form.categories" />
      </div>
      <hlm-separator />

      <div class="space-y-2">
        <h4 class="text-sm font-medium text-foreground">Sort By</h4>
        <app-filter-sort [value]="filter.sortValue()" (valueChange)="filter.setSortValue($event)" />
      </div>
    </div>

    <hlm-sheet-footer>
      <button hlmBtn variant="outline" class="flex-1" (click)="reset()" hlmSheetClose>Reset</button>
      <button hlmBtn class="flex-1" (click)="apply()" hlmSheetClose>Apply</button>
    </hlm-sheet-footer>
  </hlm-sheet-content>
</hlm-sheet>
