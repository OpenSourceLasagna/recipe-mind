<hlm-card
  (click)="onClick()"
  class="w-full cursor-pointer transition-shadow hover:shadow-md"
>
  <hlm-card-header>
    <h3 hlmCardTitle class="line-clamp-2">{{ recipe().title }}</h3>
  </hlm-card-header>
  <div hlmCardContent>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-muted-foreground">
      <hlm-badge variant="outline" [class]="badgeClass()">
        {{ recipe().difficulty }}
      </hlm-badge>

      <span class="flex items-center gap-1">
        <ng-icon name="heroClock" class="size-4" />
        {{ recipe().durationMinutes }} min
      </span>

      <span class="flex items-center gap-1">
        <ng-icon name="heroUsers" class="size-4" />
        {{ recipe().servings }} serving{{ recipe().servings !== 1 ? 's' : '' }}
      </span>

      <span class="flex items-center gap-0.5">
        @for (i of spiceArray; track i) {
          <ng-icon
            name="heroFire"
            class="size-3.5"
            [class.text-orange-500]="i <= recipe().spice_level"
            [class.text-muted-foreground-20]="i > recipe().spice_level"
          />
        }
      </span>
    </div>
  </div>
</hlm-card>
