<hlm-card
  (click)="onClick()"
  class="w-full h-full cursor-pointer transition-shadow hover:shadow-md"
>
  <hlm-card-header>
    <h3 hlmCardTitle class="line-clamp-2">{{ recipe().title }}</h3>
  </hlm-card-header>
  <div hlmCardContent>
    <app-recipe-meta-bar
      [difficulty]="recipe().difficulty"
      [durationMinutes]="recipe().durationMinutes"
      [servings]="recipe().servings"
      [spiceLevel]="recipe().spice_level"
      [compact]="true"
    />
  </div>
</hlm-card>
